<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1215" width="1000" height="1215" role="img" aria-labelledby="gu-title gu-desc">
  <title id="gu-title">One GRPO update: group-relative advantages for a single prompt</title>
  <desc id="gu-desc">One prompt q is given to the old policy, which samples a group of four outputs. Illustrative rewards are 0, 1, 1 and 2. Within this same-prompt group the mean is 1 and the population standard deviation is 1 over square root of 2, about 0.707, so advantages are (r minus mean) divided by (std plus eta), eta equal to 1e-8, giving approximately minus 1.414, 0, 0 and plus 1.414. These are labeled negative incentive, zero surrogate signal, zero surrogate signal and positive incentive; because parameters are shared, actual probability changes are coupled and not guaranteed. There is no learned critic, and if all rewards in a group are tied every advantage is zero. The advantages weight a clipped policy surrogate whose likelihood ratio uses fixed old-policy scores as the denominator. A reference model frozen at the start of the stage supplies a separate KL penalty that is not part of the reward. The objective, clipped policy surrogate minus beta times the reference penalty, updates the current policy. Old-policy scores stay fixed within one rollout's update steps and are refreshed for the next batch; the reference stays fixed for the whole stage. Objective after DeepSeek-R1 v1 equations 1 to 3; normalization follows this repository. Rewards are illustrative, not experimental results.</desc>
  <defs>
    <marker id="gu-ah-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F3A5F"/>
    </marker>
    <marker id="gu-ah-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F8B8D"/>
    </marker>
    <marker id="gu-ah-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1E293B; }
      .title { font-size: 30px; font-weight: 700; fill: #1F3A5F; }
      .subtitle { font-size: 18px; fill: #475569; }
      .h { font-size: 20px; font-weight: 700; }
      .b { font-size: 18px; fill: #334155; }
      .th { font-size: 18px; font-weight: 700; fill: #FFFFFF; }
      .inv { fill: #FFFFFF; }
      .data-h { font-size: 20px; font-weight: 700; fill: #0B6466; }
      .data-t { font-size: 18px; font-weight: 600; fill: #0B6466; }
      .neg { font-size: 18px; font-weight: 700; fill: #1F3A5F; }
      .pos { font-size: 18px; font-weight: 700; fill: #0B6466; }
      .zero { font-size: 18px; fill: #64748B; }
      .note { font-size: 18px; fill: #475569; font-style: italic; }
      .foot { font-size: 18px; fill: #475569; }
      .model { fill: #FFFFFF; stroke: #1F3A5F; stroke-width: 2.5; }
      .stage { fill: #EAF0F6; stroke: #64748B; stroke-width: 1.5; }
      .objective { fill: #EAF0F6; stroke: #1F3A5F; stroke-width: 2.5; }
      .out { fill: #1F3A5F; stroke: #1F3A5F; stroke-width: 2.5; }
      .data { fill: #E8F5F4; stroke: #0F8B8D; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .panel { fill: #F4F6F9; stroke: #D3DAE3; stroke-width: 1.5; }
      .w { fill: none; stroke: #1F3A5F; stroke-width: 2.5; }
      .d { fill: none; stroke: #0F8B8D; stroke-width: 2.5; stroke-dasharray: 8 6; }
      .c { fill: none; stroke: #64748B; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="1215" fill="#FCFCFA"/>

  <!-- Heading -->
  <text class="title" x="500" y="54" text-anchor="middle">One GRPO update for a single prompt</text>
  <text class="subtitle" x="500" y="82" text-anchor="middle">Group-relative advantages from four sampled outputs (illustrative rewards, not an experiment)</text>

  <!-- ============ Sampling ============ -->
  <rect class="data" x="40" y="110" width="180" height="90" rx="10"/>
  <text class="data-h" x="130" y="147" text-anchor="middle">Prompt q</text>
  <text class="b" x="130" y="173" text-anchor="middle">one question</text>

  <rect class="model" x="270" y="110" width="300" height="90" rx="10"/>
  <text class="h" x="420" y="147" text-anchor="middle">Old policy π_old</text>
  <text class="b" x="420" y="173" text-anchor="middle">samples G = 4 outputs</text>

  <rect class="panel" x="620" y="110" width="336" height="90" rx="10"/>
  <text class="h" x="788" y="147" text-anchor="middle">Baseline from the group</text>
  <text class="b" x="788" y="173" text-anchor="middle">same prompt; no learned critic</text>

  <line class="d" x1="220" y1="155" x2="268" y2="155" marker-end="url(#gu-ah-teal)"/>
  <path class="d" d="M420,200 V225 H90 V248" marker-end="url(#gu-ah-teal)"/>

  <!-- ============ Group table ============ -->
  <rect x="40" y="250" width="580" height="40" fill="#1F3A5F"/>
  <text class="th" x="90" y="276" text-anchor="middle">Output</text>
  <text class="th" x="200" y="276" text-anchor="middle">Reward</text>
  <text class="th" x="330" y="276" text-anchor="middle">Advantage</text>
  <text class="th" x="510" y="276" text-anchor="middle">Surrogate signal</text>

  <rect x="40" y="290" width="580" height="56" fill="#FFFFFF"/>
  <rect x="40" y="346" width="580" height="56" fill="#F4F6F9"/>
  <rect x="40" y="402" width="580" height="56" fill="#FFFFFF"/>
  <rect x="40" y="458" width="580" height="56" fill="#F4F6F9"/>
  <rect x="40" y="250" width="580" height="264" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="140" y1="290" x2="140" y2="514" stroke="#D3DAE3" stroke-width="1.5"/>
  <line x1="260" y1="290" x2="260" y2="514" stroke="#D3DAE3" stroke-width="1.5"/>
  <line x1="400" y1="290" x2="400" y2="514" stroke="#D3DAE3" stroke-width="1.5"/>

  <text class="b" x="90" y="325" text-anchor="middle">o₁</text>
  <text class="b" x="200" y="325" text-anchor="middle">0</text>
  <text class="neg" x="330" y="325" text-anchor="middle">≈ −1.414</text>
  <text class="neg" x="510" y="325" text-anchor="middle">negative incentive</text>

  <text class="b" x="90" y="381" text-anchor="middle">o₂</text>
  <text class="b" x="200" y="381" text-anchor="middle">1</text>
  <text class="zero" x="330" y="381" text-anchor="middle">0</text>
  <text class="zero" x="510" y="381" text-anchor="middle">zero surrogate signal</text>

  <text class="b" x="90" y="437" text-anchor="middle">o₃</text>
  <text class="b" x="200" y="437" text-anchor="middle">1</text>
  <text class="zero" x="330" y="437" text-anchor="middle">0</text>
  <text class="zero" x="510" y="437" text-anchor="middle">zero surrogate signal</text>

  <text class="b" x="90" y="493" text-anchor="middle">o₄</text>
  <text class="b" x="200" y="493" text-anchor="middle">2</text>
  <text class="pos" x="330" y="493" text-anchor="middle">≈ +1.414</text>
  <text class="pos" x="510" y="493" text-anchor="middle">positive incentive</text>

  <!-- ============ Group statistics ============ -->
  <rect class="panel" x="660" y="250" width="296" height="264" rx="10"/>
  <text class="h" x="680" y="283">Group statistics</text>
  <text class="b" x="680" y="313">rewards (0, 1, 1, 2)</text>
  <text class="b" x="680" y="339">mean = 1</text>
  <text class="b" x="680" y="365">population std</text>
  <text class="b" x="680" y="391">= 1/√2 ≈ 0.707</text>
  <text class="b" x="680" y="423">A = (r − mean) / (std + η)</text>
  <text class="b" x="680" y="449">η = 1e-8 guards division</text>
  <text class="b" x="680" y="481">all rewards tied → all A = 0</text>

  <!-- advantages flow into the surrogate -->
  <path class="d" d="M330,514 V560 H480 V628" marker-end="url(#gu-ah-teal)"/>
  <text class="data-t" x="494" y="600">advantages A</text>

  <!-- ============ Objective ============ -->
  <rect class="model" x="40" y="630" width="240" height="100" rx="10"/>
  <text class="h" x="160" y="664" text-anchor="middle">Old policy π_old</text>
  <text class="b" x="160" y="690" text-anchor="middle">fixed scores:</text>
  <text class="b" x="160" y="714" text-anchor="middle">ratio denominator</text>

  <rect class="stage" x="320" y="630" width="320" height="100" rx="10"/>
  <text class="h" x="480" y="664" text-anchor="middle">Clipped policy surrogate</text>
  <text class="b" x="480" y="690" text-anchor="middle">ratio π_θ / π_old, clip ε</text>
  <text class="b" x="480" y="714" text-anchor="middle">weighted by advantages</text>

  <rect class="model" x="706" y="630" width="250" height="100" rx="10"/>
  <text class="h" x="831" y="664" text-anchor="middle">Reference π_ref</text>
  <text class="b" x="831" y="690" text-anchor="middle">frozen at stage start</text>
  <text class="b" x="831" y="714" text-anchor="middle">fixed for the stage</text>

  <rect class="out" x="40" y="780" width="240" height="100" rx="10"/>
  <text class="h inv" x="160" y="822" text-anchor="middle">Current policy π_θ</text>
  <text class="b inv" x="160" y="848" text-anchor="middle">gradient update</text>

  <rect class="objective" x="320" y="780" width="320" height="100" rx="10"/>
  <text class="h" x="480" y="812" text-anchor="middle">Objective (maximize)</text>
  <text class="b" x="480" y="838" text-anchor="middle">clipped policy surrogate</text>
  <text class="b" x="480" y="862" text-anchor="middle">− β · reference penalty</text>

  <rect class="stage" x="706" y="780" width="250" height="100" rx="10"/>
  <text class="h" x="831" y="812" text-anchor="middle">Reference penalty</text>
  <text class="b" x="831" y="838" text-anchor="middle">sampled KL estimator</text>
  <text class="b" x="831" y="862" text-anchor="middle">not in the reward</text>

  <line class="w" x1="280" y1="680" x2="318" y2="680" marker-end="url(#gu-ah-navy)"/>
  <line class="c" x1="480" y1="730" x2="480" y2="778" marker-end="url(#gu-ah-slate)"/>
  <line class="w" x1="831" y1="730" x2="831" y2="778" marker-end="url(#gu-ah-navy)"/>
  <line class="c" x1="706" y1="830" x2="642" y2="830" marker-end="url(#gu-ah-slate)"/>
  <line class="w" x1="320" y1="830" x2="282" y2="830" marker-end="url(#gu-ah-navy)"/>

  <!-- ============ Lifecycle ============ -->
  <rect x="40" y="910" width="916" height="110" rx="10" fill="#FFFFFF" stroke="#D3DAE3" stroke-width="1.5"/>
  <text class="h" x="64" y="942">Lifecycle</text>
  <text class="b" x="64" y="972">π_old: fixed within one rollout's update steps; refreshed for the next batch</text>
  <text class="b" x="64" y="1002">π_ref: fixed for the whole stage; KL penalty is a separate term, not in the reward</text>

  <text class="note" x="40" y="1052">Signs set each sample's incentive in the surrogate. Parameters are shared, so actual</text>
  <text class="note" x="40" y="1078">probability changes are coupled and not guaranteed to follow the signs.</text>

  <!-- ============ Legend ============ -->
  <line class="w" x1="40" y1="1110" x2="98" y2="1110" marker-end="url(#gu-ah-navy)"/>
  <text class="b" x="110" y="1116">Model weights / scores</text>
  <line class="d" x1="340" y1="1110" x2="398" y2="1110" marker-end="url(#gu-ah-teal)"/>
  <text class="b" x="410" y="1116">Data: samples, rewards, advantages</text>
  <line class="c" x1="760" y1="1110" x2="818" y2="1110" marker-end="url(#gu-ah-slate)"/>
  <text class="b" x="830" y="1116">Loss terms</text>

  <!-- ============ Footer ============ -->
  <line x1="40" y1="1138" x2="956" y2="1138" stroke="#D3DAE3" stroke-width="1.5"/>
  <text class="foot" x="40" y="1168">Objective after DeepSeek-R1 v1 (arXiv:2501.12948), Eqs. 1–3; normalization follows</text>
  <text class="foot" x="40" y="1194">this repository (population std, η = 1e-8, tied groups → 0). Rewards are illustrative.</text>
</svg>
