name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Everything must run offline: no model or dataset downloads.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (CPU-only torch wheel to keep CI small)
        run: |
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,hf]"

      - name: Lint
        run: |
          uv run --no-sync ruff format --check .
          uv run --no-sync ruff check .

      - name: Tests
        run: uv run --no-sync pytest

      - name: CLI smoke
        run: |
          uv run --no-sync r1-grpo --help
          uv run --no-sync r1-grpo smoke --output-dir runs/ci-smoke
